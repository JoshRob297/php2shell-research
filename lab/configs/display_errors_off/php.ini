; php2shell lab settings - Off-chain profile (display_errors=Off).
; Mounted into the official php:8.4.26-apache image, same docker run commands
; as the On profile, swapping the ini mount path.
; Source: lab profile used for the A+B Off chain and the ASLR-off RCE runs.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL

memory_limit = 8M
post_max_size = 512M
upload_max_filesize = 512M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
