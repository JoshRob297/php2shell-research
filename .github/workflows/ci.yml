name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Run checker unit tests
        run: |
          python3 -m unittest discover -s tooling/checker -p "test_*.py"

      - name: Dry-run smoke test
        run: |
          python3 tooling/checker/checker.py --url http://127.0.0.1:8080/ --local --dry-run
