# One prefork worker: the study depends on both requests (A and B) landing in
# the same process. KeepAlive off avoids a second connection pinning the worker.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    ServerLimit 1
    MaxConnectionsPerChild 0
</IfModule>
