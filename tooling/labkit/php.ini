; Lab configuration for the php2shell PS(id) study.
; Mirrors the reference run (memory_limit=8M is a deliberate calibration
; override, not a PHP default). Keep one worker (see apache-prefork.conf).
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M
session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
